<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo Prodotti</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    #catalog {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .product {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
      max-width: 200px;
    }
    .product h3 {
      margin: 0 0 10px;
    }
    .product button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 3px;
    }
    .product button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Catalogo Prodotti</h1>
  <div id="catalog">Caricamento...</div>

  <script>
    const catalogContainer = document.getElementById('catalog');
    const apiBaseUrl = 'http://localhost:1337'; // URL del server Strapi
    const productsEndpoint = '/api/prodottis';

    // Funzione per ottenere i prodotti da Strapi
    async function fetchProducts() {
      try {
        const response = await fetch(`${apiBaseUrl}${productsEndpoint}`);
        console.log('Stato della risposta:', response.status);
        console.log('Risposta grezza:', response);

        if (!response.ok) {
          throw new Error('Errore nel recupero dei prodotti');
        }

        const data = await response.json();
        console.log('Dati ricevuti:', data);

        renderProducts(data.data);
      } catch (error) {
        console.error('Errore:', error);
        catalogContainer.innerHTML = '<p>Errore nel caricamento dei prodotti. Riprova più tardi.</p>';
      }
    }

    // Funzione per visualizzare i prodotti
    function renderProducts(products) {
      console.log('Prodotti ricevuti per il rendering:', products);

      if (!products || products.length === 0) {
        catalogContainer.innerHTML = '<p>Nessun prodotto disponibile.</p>';
        return;
      }

      catalogContainer.innerHTML = '';
      products.forEach((product) => {
        console.log('Prodotto:', product);
        const productElement = document.createElement('div');
        productElement.className = 'product';
        productElement.innerHTML = `
          <h3>${product.attributes.name}</h3>
          <p>${product.attributes.description}</p>
          <strong>Prezzo: €${product.attributes.price}</strong>
          <button onclick="editProduct(${product.id})">Modifica</button>
        `;
        catalogContainer.appendChild(productElement);
      });
    }

    // Funzione per modificare un prodotto
    async function editProduct(productId) {
      const newName = prompt('Inserisci il nuovo nome del prodotto:');
      const newDescription = prompt('Inserisci la nuova descrizione del prodotto:');
      const newPrice = prompt('Inserisci il nuovo prezzo del prodotto:');

      if (!newName || !newDescription || !newPrice) {
        alert('Tutti i campi devono essere compilati!');
        return;
      }

      try {
        const response = await fetch(`${apiBaseUrl}${productsEndpoint}/${productId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            data: {
              name: newName,
              description: newDescription,
              price: parseFloat(newPrice),
            },
          }),
        });

        if (!response.ok) {
          throw new Error('Errore durante la modifica del prodotto');
        }

        alert('Prodotto aggiornato con successo!');
        fetchProducts(); // Aggiorna la lista dei prodotti
      } catch (error) {
        console.error('Errore:', error);
      }
    }

    // Esegui il fetch iniziale dei prodotti
    fetchProducts();
  </script>
</body>
</html>
